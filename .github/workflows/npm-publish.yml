name: npm-publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a preview release to npm
        required: true
        type: boolean
        default: false
      preview_identifier:
        description: Optional preview version identifier. Defaults to the short commit SHA.
        required: false
        type: string

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run ci

      - name: Set preview version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
        env:
          PREVIEW_IDENTIFIER: ${{ inputs.preview_identifier }}
        run: |
          preview_identifier="${PREVIEW_IDENTIFIER:-${GITHUB_SHA::7}}"
          preview_identifier="$(printf '%s' "$preview_identifier" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z-]+/-/g; s/^-+//; s/-+$//')"

          if [ -z "$preview_identifier" ]; then
            echo "Preview identifier must contain at least one letter or number." >&2
            exit 1
          fi

          current_version="$(node -p "require('./package.json').version")"
          base_version="${current_version%%-*}"
          npm version --no-git-tag-version "$base_version-preview.$preview_identifier"

      - name: Pack package artifact
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}

    steps:
      - name: Create GitHub release if needed
        id: create_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '')

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })

              core.setOutput('release_id', String(existing.data.id))
            } catch (error) {
              if (error.status !== 404) throw error

              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body: 'Release notes are being generated.',
                draft: false,
                prerelease: false,
              })

              core.setOutput('release_id', String(created.data.id))
            }

      - name: Dispatch opencode release-notes workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'opencode.yml',
              ref: context.ref.replace('refs/tags/', ''),
              inputs: {
                tag: context.ref.replace('refs/tags/', ''),
                release_id: `${{ steps.create_release.outputs.release_id }}`,
              },
            })

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish to npm
        run: npm publish ./*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish preview to npm
        run: npm publish ./*.tgz --provenance --access public --tag preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
