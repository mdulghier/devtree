name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/glm-5.1

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release if needed
        id: create_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '')

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })

              core.setOutput('release_id', String(existing.data.id))
              core.setOutput('release_tag', tag)
              core.setOutput('created', 'false')
            } catch (error) {
              if (error.status !== 404) throw error

              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body: 'Release notes are being generated.',
                draft: false,
                prerelease: false,
              })

              core.setOutput('release_id', String(created.data.id))
              core.setOutput('release_tag', tag)
              core.setOutput('created', 'true')
            }

      - name: Run opencode release automation
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.1
          use_github_token: true
          prompt: |
            Update the body of the existing GitHub release for the pushed tag.

            Requirements:
            - Inspect the pushed git ref and use that version tag as the release tag.
            - Inspect `package.json` and verify its `version` matches the pushed tag without the leading `v`.
            - If the pushed tag and `package.json` version do not match, fail without modifying the release.
            - Inspect the existing GitHub releases and tags.
            - A GitHub release for the pushed tag already exists. Its release id is `${{ steps.create_release.outputs.release_id }}`.
            - Find the previous release before the pushed tag and read all commits from that release up to the tagged commit.
            - Write concise, high-quality release notes that summarize the user-facing changes and group related work where appropriate.
            - Update only the release title and body for the existing release associated with the pushed tag.
            - Do not modify repository files, do not open a pull request, and do not publish to npm.

            Release note expectations:
            - Start with a short summary paragraph.
            - Then include a bullet list of the most important changes.
            - Base the notes on the actual commits since the last release, not generic boilerplate.
