library:
  name: 'devtree'
  version: '0.1.0'
  repository: 'https://github.com/mdulghier/devtree'
  description: 'Worktree-aware local development orchestration for Vite+ apps.'
  primary_framework: 'framework-agnostic'

domains:
  - name: 'configuring isolated worktrees'
    slug: 'configuring-isolated-worktrees'
    description: 'Setting up repo-level configuration so each worktree gets isolated URLs, env values, and dependency names.'
  - name: 'operating isolated development runtime'
    slug: 'operating-isolated-development-runtime'
    description: 'Running, checking, inspecting, and cleaning up a worktree-scoped dev environment once configuration exists.'

skills:
  - name: 'set up devtree'
    slug: 'devtree-set-up-devtree'
    domain: 'configuring-isolated-worktrees'
    description: 'Install and configure devtree so a repo can run safely in multiple worktrees without local collisions.'
    type: 'core'
    covers:
      - 'define_devtree_config'
      - 'devtree.config.ts'
      - 'env.provider'
      - 'env.entries'
      - 'dependencies'
      - 'hooks'
      - 'devtree_vite_plugins'
      - 'doctor --fix'
      - 'setup'
    tasks:
      - 'Create a minimal devtree.config.ts for a Vite+ app'
      - 'Inject worktree-specific APP_URL and dependency ports'
      - 'Configure dotenv or varlock-backed env management'
      - 'Wire Docker Compose dependencies and setup hooks'
    failure_modes:
      - mistake: 'Hard-code shared URLs and ports'
        mechanism: 'Static APP_URL values or fixed dependency ports remove the worktree isolation that devtree is designed to provide, so sibling worktrees collide again.'
        wrong_pattern: |
          export default define_devtree_config({
            app_name: 'my-app',
            env: {
              provider: 'dotenv',
              entries: () => [
                { kind: 'value', key: 'APP_URL', value: 'http://localhost:3000' },
                { kind: 'value', key: 'DATABASE_PORT', value: '5432' },
              ],
            },
          })
        correct_pattern: |
          export default define_devtree_config({
            app_name: 'my-app',
            env: {
              provider: 'dotenv',
              entries: ({ instance }) => [
                { kind: 'value', key: 'APP_URL', value: instance.public_url },
                {
                  kind: 'value',
                  key: 'DATABASE_PORT',
                  value: String(instance.allocate_port('postgres', 5400)),
                },
              ],
            },
          })
        source: 'README.md'
        priority: 'CRITICAL'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; isolation depends on instance-derived values.'
      - mistake: 'Store manual values inside managed block'
        mechanism: 'The managed env block is regenerated on every run, so custom edits made inside it are silently replaced while only text outside the block is preserved.'
        wrong_pattern: |
          # >>> devtree managed env >>>
          APP_URL=http://feature-x.my-app.localhost:1355
          STRIPE_SECRET_KEY=sk_live_manual_override
          # <<< devtree managed env <<<
        correct_pattern: |
          # >>> devtree managed env >>>
          APP_URL=http://feature-x.my-app.localhost:1355
          # <<< devtree managed env <<<

          STRIPE_SECRET_KEY=sk_live_manual_override
        source: 'src/env-file.ts'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; ensure_env_file rewrites the managed block from config entries.'
      - mistake: 'Force shared dependency project names'
        mechanism: 'Overriding Compose project names with static values makes multiple worktrees point at the same Docker resource names, defeating scoped dependency isolation.'
        wrong_pattern: |
          dependencies: [
            {
              kind: 'compose',
              name: 'db',
              project_name: 'my-app',
            },
          ]
        correct_pattern: |
          dependencies: [
            {
              kind: 'compose',
              name: 'db',
              project_name: ({ instance }) => instance.get_scoped_name('db'),
            },
          ]
        source: 'src/cli.ts:156'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; default naming is safely scoped, custom static naming is not.'
      - mistake: 'Enable varlock without integration prerequisites'
        mechanism: 'Varlock mode requires the varlock CLI, a schema file, and @varlock/vite-integration; missing any of them breaks setup or Vite plugin loading.'
        wrong_pattern: |
          export default define_devtree_config({
            app_name: 'my-app',
            env: {
              provider: 'varlock',
              entries: ({ instance }) => [
                { kind: 'value', key: 'APP_URL', value: instance.public_url },
              ],
            },
          })
        correct_pattern: |
          pnpm add -D varlock @varlock/vite-integration
          touch .env.schema

          export default define_devtree_config({
            app_name: 'my-app',
            env: {
              provider: 'varlock',
              schema_path: '.env.schema',
              entries: ({ instance }) => [
                { kind: 'value', key: 'APP_URL', value: instance.public_url },
              ],
            },
          })
        source: 'src/cli.ts:338, src/vite.ts:45'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; doctor validates prerequisites and the plugin import throws if missing.'
    compositions:
      - library: 'vite-plus'
        skill: ''
      - library: 'portless'
        skill: ''
      - library: 'varlock'
        skill: ''

  - name: 'run and operate devtree'
    slug: 'devtree-run-and-operate-devtree'
    domain: 'operating-isolated-development-runtime'
    description: 'Run the worktree-scoped dev environment, verify it is healthy, inspect the current instance, and clean up orphaned resources.'
    type: 'core'
    covers:
      - 'dev'
      - 'info'
      - 'env write'
      - 'env show'
      - 'deps start|stop|logs'
      - 'gc'
      - 'gc --dry-run'
      - 'doctor'
    tasks:
      - 'Start the dev server through devtree instead of raw vite'
      - 'Check whether env injection and the public URL are correct'
      - 'Get the current worktree URL and scoped resource names'
      - 'Remove orphaned Docker resources from deleted worktrees'
    failure_modes:
      - mistake: 'Start Vite directly instead of devtree'
        mechanism: 'Running the dev server outside devtree skips portless wrapping, skips devtree runtime env injection, and reintroduces URL and port collisions across worktrees.'
        wrong_pattern: |
          {
            "scripts": {
              "dev": "vp dev"
            }
          }
        correct_pattern: |
          {
            "scripts": {
              "devtree": "devtree"
            }
          }

          pnpm devtree dev
        source: 'README.md, src/command-builder.ts'
        priority: 'CRITICAL'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; development command wraps Vite with portless and optionally varlock.'
        skills: ['devtree-run-and-operate-devtree', 'devtree-set-up-devtree']
      - mistake: 'Disable portless and expect APP_URL to exist'
        mechanism: 'When PORTLESS=0 or portless is disabled, devtree does not inject a public URL, so auth flows that rely on a stable public callback URL need an explicit fallback such as BETTER_AUTH_URL.'
        wrong_pattern: |
          PORTLESS=0 pnpm devtree dev

          export default define_devtree_config({
            app_name: 'my-app',
            portless: { enabled: false },
            env: { provider: 'dotenv', entries: () => [] },
          })
        correct_pattern: |
          BETTER_AUTH_URL=http://localhost:3000 PORTLESS=0 pnpm devtree dev

          export default define_devtree_config({
            app_name: 'my-app',
            portless: { enabled: false },
            env: { provider: 'dotenv', entries: () => [] },
          })
        source: 'src/cli.ts:499'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; CLI emits a warning before starting dev.'
      - mistake: 'Skip setup when dependencies or hooks matter'
        mechanism: 'The dev command writes env state and starts Vite, but dependency startup and setup hooks run during setup, so apps can fail in confusing ways if developers jump straight to dev.'
        wrong_pattern: |
          pnpm devtree dev
        correct_pattern: |
          pnpm devtree setup
          pnpm devtree dev
        source: 'README.md, src/cli.ts:448'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; setup starts dependencies and runs setup/migrate/post_setup hooks.'
      - mistake: 'Assume gc removes unknown docker projects'
        mechanism: 'Garbage collection intentionally skips projects without worktree metadata, so unlabeled or legacy resources can linger until cleaned manually or re-registered.'
        source: 'src/gc.ts:356'
        priority: 'MEDIUM'
        status: 'active'
        version_context: 'Current behavior in v0.1.0; unknown projects are reported as skipped, not removed.'

tensions:
  - name: 'simple setup versus explicit override freedom'
    skills: ['devtree-set-up-devtree', 'devtree-run-and-operate-devtree']
    description: 'Devtree works best when it owns the generated URL/env/dependency wiring, but advanced users can override those knobs in ways that quietly remove isolation.'
    implication: 'An agent that optimizes for user familiarity may hard-code names, ports, or URLs instead of preserving devtree-managed defaults.'
  - name: 'portless compatibility versus public URL correctness'
    skills: ['devtree-set-up-devtree', 'devtree-run-and-operate-devtree']
    description: 'Disabling portless can simplify local setup in constrained environments, but it also removes the stable public URL contract that other local tooling may depend on.'
    implication: 'An agent that disables portless without compensating config leaves auth and callback-driven flows subtly broken.'

